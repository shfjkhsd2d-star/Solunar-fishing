<!doctype html>
<html lang="en-AU">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#071b2b">
  <meta name="description" content="Plan your next fishing session with moon, sun and verified tide information in the Whitsundays.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Solunar Tide">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <link rel="icon" type="image/png" href="./icon-192.png">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="stylesheet" href="./styles.css?v=3.13">
  <title>Solunar / Tide — Fishing Planner</title>
  <script src="./astro.js?v=3.13" defer></script>
  <script src="./tides.js?v=3.13" defer></script>
  <script src="./weather.js?v=3.13" defer></script>
  <script src="./movement.js?v=3.13" defer></script>
  <script src="./marine.js?v=3.13" defer></script>
  <script src="./app.js?v=3.13" defer></script>
</head>
<body>
  <div class="shell">
    <header class="site-header">
      <div>
        <div class="brand"><span class="brand-mark" aria-hidden="true">◉</span> SOLUNAR <span class="accent">/ TIDE</span></div>
        <p class="tagline">Fishing window planner · Whitsundays</p>
      </div>
      <span class="status-pill">V3.13 LIVE</span>
    </header>
    <main id="app" aria-live="off">
      <div class="card"><p>Loading fishing forecast…</p></div>
    </main>
    <footer class="site-footer">Fishing windows are guidance, not catch guarantees. Check current conditions before heading out.</footer>
  </div>
  <nav class="bottom-nav" aria-label="Main navigation">
    <div class="nav-inner">
      <button class="nav-item active" type="button" data-tab="today" aria-current="page"><span aria-hidden="true">◉</span><span>Today</span></button>
      <button class="nav-item" type="button" data-tab="calendar"><span aria-hidden="true">▦</span><span>Calendar</span></button>
      <button class="nav-item" type="button" data-tab="trips"><span aria-hidden="true">⚑</span><span>Trips</span></button>
      <button class="nav-item" type="button" data-tab="tides"><span aria-hidden="true">≋</span><span>Tides</span></button>
      <button class="nav-item" type="button" data-tab="about"><span aria-hidden="true">ⓘ</span><span>About</span></button>
    </div>
  </nav>
  <noscript><p class="no-script">JavaScript must be enabled to calculate fishing windows.</p></noscript>
</body>
</html>
