name: Sync official Queensland tide predictions
on:
  push:
    branches: [main]
    # Sync on every ordinary GitHub upload. Commits made with GITHUB_TOKEN
    # do not trigger a second workflow, so this is safe.
  workflow_dispatch:
  schedule:
    # QLD annual predicted high/low resources; check for updates weekly.
    - cron: '23 2 * * 1'
permissions:
  contents: write
concurrency:
  group: tide-data-sync
  cancel-in-progress: false
jobs:
  fetch-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Retrieve and validate QLD tides via Web API and CSV fallback
        run: python scripts/sync_qld_tides.py
      - name: Commit updated public tide files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tide-data/
          if ! git diff --cached --quiet; then
            git commit -m "Update official Queensland tide predictions [skip ci]"
            git push
          else
            echo "No tide data changes"
          fi
