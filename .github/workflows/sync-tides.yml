name: Sync official Queensland tide predictions
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '23 2 * * 1'
permissions:
  contents: write
concurrency:
  group: tide-data-sync
  cancel-in-progress: false
jobs:
  fetch-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Retrieve and validate QLD tides via Web API and CSV fallback
        run: python scripts/sync_qld_tides.py
      - name: Retrieve and validate QLD 10-minute interval predictions
        id: intervals
        continue-on-error: true
        run: python scripts/sync_qld_intervals.py
      - name: Report interval sync result
        if: always()
        run: |
          echo "## Queensland 10-minute tides" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.intervals.outcome }}" = "success" ]; then
            echo "Interval sync completed. Check generated tide-data/interval-manifest.json for which years/stations were verified." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Interval sync did not complete. High/low tides remain available. Expand the interval step above to inspect its error." >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -d tide-data ]; then
            find tide-data -maxdepth 1 -type f -name '*-10min.json' -printf '%f\n' | sort >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Commit updated public tide files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tide-data/
          if ! git diff --cached --quiet; then
            git commit -m "Update official Queensland tide predictions [skip ci]"
            git push
          else
            echo "No tide data changes"
          fi
